<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Book</title>
  <meta name="description" content="Leave a signature and share your thoughts in my guestbook. Say hi before you go!">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="guestbook.css">
</head>

<body class="background">
  <nav class="nav">
    <ul>
      <li style="display:inline-block; vertical-align:top; margin-right:20px;" class="home">
        <a href="index.html" class="first">home</a>
      </li>
      <li style="display:inline-block; vertical-align:top; margin-right:20px;">
        <a href="philosophies.html" class="second">philosophies</a>
      </li>
      <li style="display:inline-block; vertical-align:top;">
        <a href="guestbook.html" class="third active">guestbook</a>
      </li>
    </ul>
  </nav>

  <div class="container">
    <h1></h1>
    <p class="p">Don't forget to say Hi before you go.</p>

    <form id="guestbook-form">
      <label for="visitor-name" class="sign">Your Name</label>
      <input
        type="text"
        id="visitor-name"
        name="visitor-name"
        placeholder="What should I call you?"
        required
        maxlength="100"
        autocomplete="name"
      >

      <label for="experience" class="sign">Your Thoughts</label>
      <textarea
        id="experience"
        name="experience"
        placeholder="Write your experience here..."
        required
        maxlength="2000"
      ></textarea>

      <label for="signature-pad" class="sign">Sign here</label>
      <div class="signature-container">
        <canvas id="signature-pad" width="400" height="200"></canvas>
        <div class="signature-buttons">
          <button type="button" id="undo-signature" class="clear-btn">Undo</button>
          <button type="button" id="clear-signature" class="clear-btn">Clear Signature</button>
        </div>
      </div>

      <button type="submit" id="submit-btn">Submit</button>
      <p id="form-status" aria-live="polite" style="text-align:center; margin-top:8px; font-size:14px; min-height:20px;"></p>
    </form>

    <div id="reviews" class="reviews" aria-live="polite">
      <p class="p" style="text-align:center; opacity:0.6;">Loading entries…</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('guestbook-form');
      const reviewsEl = document.getElementById('reviews');
      const canvas = document.getElementById('signature-pad');
      const ctx = canvas.getContext('2d');
      const clearBtn = document.getElementById('clear-signature');
      const undoBtn = document.getElementById('undo-signature');
      const submitBtn = document.getElementById('submit-btn');
      const formStatus = document.getElementById('form-status');

      let drawing = false;
      let strokes = [];

      // ─── Signature Drawing ───────────────────────────────────────────
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDrawing(e) {
        drawing = true;
        const pos = getPos(e);
        strokes.push([{ x: pos.x, y: pos.y }]);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
      }

      function draw(e) {
        if (!drawing) return;
        const pos = getPos(e);
        strokes[strokes.length - 1].push({ x: pos.x, y: pos.y });
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
        e.preventDefault();
      }

      function stopDrawing() { drawing = false; }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        strokes.forEach(stroke => {
          if (stroke.length < 1) return;
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();
        });
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);

      clearBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        strokes = [];
      });

      undoBtn.addEventListener('click', () => {
        strokes.pop();
        redraw();
      });

      // ─── Render a single review card ─────────────────────────────────
      function createReviewEl(entry) {
        const wrapper = document.createElement('div');
        wrapper.className = 'review';

        const header = document.createElement('div');
        header.className = 'review-header';

        const pic = document.createElement('img');
        pic.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(entry.name || 'Guest')}&background=random`;
        pic.className = 'review-profile-pic';
        pic.alt = '';

        const headerText = document.createElement('span');
        const date = new Date(entry.time);
        headerText.textContent = (entry.name || 'Guest') + ' • ' + date.toLocaleString();

        header.appendChild(pic);
        header.appendChild(headerText);

        const body = document.createElement('div');
        body.className = 'review-body';

        const textSpan = document.createElement('span');
        textSpan.className = 'review-text';
        textSpan.textContent = entry.text;
        body.appendChild(textSpan);

        if (entry.signature) {
          const sigImg = document.createElement('img');
          sigImg.src = entry.signature;
          sigImg.className = 'signature-display';
          sigImg.alt = 'Visitor signature';
          body.appendChild(sigImg);
        }

        wrapper.appendChild(header);
        wrapper.appendChild(body);
        return wrapper;
      }

      // ─── Load entries from Netlify Function ──────────────────────────
      async function loadEntries() {
        try {
          const res = await fetch('/api/entries');
          if (!res.ok) throw new Error(`Server error: ${res.status}`);
          const entries = await res.json();

          reviewsEl.innerHTML = '';
          if (!entries.length) {
            reviewsEl.innerHTML = '<p class="p" style="text-align:center; opacity:0.6;">No entries yet. Be the first to sign!</p>';
            return;
          }
          entries.forEach(entry => reviewsEl.appendChild(createReviewEl(entry)));
        } catch (err) {
          console.error('Failed to load entries:', err);
          reviewsEl.innerHTML = '<p class="p" style="text-align:center; color:#ff6b6b;">Could not load entries. Please refresh the page.</p>';
        }
      }

      // ─── Submit new entry ────────────────────────────────────────────
      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const name = document.getElementById('visitor-name').value.trim();
        const text = form.experience.value.trim();
        const signature = canvas.toDataURL();

        // Check signature is not blank
        const blank = document.createElement('canvas');
        blank.width = canvas.width;
        blank.height = canvas.height;
        if (signature === blank.toDataURL()) {
          alert('Please draw your signature before submitting.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';
        formStatus.textContent = '';

        try {
          const res = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, text, signature })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || `Server error ${res.status}`);
          }

          formStatus.style.color = '#7dff9a';
          formStatus.textContent = '✓ Signed! Thank you for visiting.';
          form.reset();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          strokes = [];

          // Reload entries to show new submission across all devices
          await loadEntries();
        } catch (err) {
          console.error('Submit failed:', err);
          formStatus.style.color = '#ff6b6b';
          formStatus.textContent = '✗ Failed to submit. Please try again.';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
        }
      });

      // Load on page open
      loadEntries();

      // Refresh every 30 seconds so new entries from other devices appear
      setInterval(loadEntries, 30000);
    });
  </script>
</body>

</html>
